name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # Everything but the real engines; the window runs on Qt's offscreen platform.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: pytest -q

  integration:
    # Against the real LanguageTool and Grammalecte, without n-gram data.
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/correcteur
          key: engines-${{ hashFiles('src/correcteur/download.py', 'src/correcteur/french.py') }}
      - run: correcteur --download --grammalecte
      - run: pytest -q -m integration -rs
